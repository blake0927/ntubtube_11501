<!doctype html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>YouTube 課程快速連結</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5fbfa;
    color: #263238;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

header {
    background: #2f6f73;
    color: #fff;
    padding: 22px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 34px);
}

main {
    width: min(1200px, 94vw);
    margin: 18px auto 36px;
}

.courses {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.course {
    border: 2px solid #c9dddd;
    background: #fff;
    color: #24575b;
    border-radius: 12px;
    padding: 16px 10px;
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 700;
    min-height: 68px;
    cursor: pointer;
}

.course.active {
    background: #2f6f73;
    color: #fff;
}

.area {
    margin-top: 18px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 270px;
    gap: 14px;
}

.player {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.side {
    background: #fff;
    border: 2px solid #c9dddd;
    border-radius: 12px;
    padding: 12px;
    max-height: 520px;
    overflow: auto;
}

.side h2 {
    font-size: 20px;
    margin: 2px 4px 12px;
    color: #24575b;
}

.ep {
    display: block;
    width: 100%;
    border: 1px solid #c9dddd;
    background: #e9f4f3;
    color: #263238;
    border-radius: 8px;
    padding: 11px 12px;
    margin: 7px 0;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.ep.active {
    background: #f4c95d;
    border-color: #d5aa36;
    font-weight: 700;
}

.full {
    display: block;
    text-align: center;
    margin-top: 12px;
    padding: 11px;
    background: #2f6f73;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
}

@media (max-width: 850px) {
    .courses {
        grid-template-columns: repeat(2, 1fr);
    }

    .area {
        grid-template-columns: 1fr;
    }

    .side {
        max-height: none;
    }
}

@media (max-width: 520px) {
    main {
        width: 96vw;
    }

    .courses {
        grid-template-columns: 1fr;
    }

    .course {
        min-height: 58px;
    }
}

    </style>
</head>

<body>

    <header>
        <h1>YouTube 課程快速連結</h1>
    </header>

    <main>

        <!-- 課程按鈕 -->
        <section id="courses" class="courses"></section>

        <!-- YouTube 播放器 + 單集清單 -->
        <section class="area">

            <div class="player">
                <iframe
                    id="yt"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <aside class="side">

                <h2 id="title"></h2>

                <div id="episodes"></div>

                <a
                    id="full"
                    class="full"
                    target="_blank"
                    rel="noopener">
                    開啟完整播放清單
                </a>

            </aside>

        </section>

    </main>

const cs = document.querySelector("#courses");
const es = document.querySelector("#episodes");
const title = document.querySelector("#title");
const yt = document.querySelector("#yt");
const full = document.querySelector("#full");

function load(i, v = 0) {
    ci = i;
    vi = v;

    document.querySelectorAll(".course").forEach((x, n) => {
        x.classList.toggle("active", n === i);
    });

    const c = data[i];

    title.textContent = c.title;
    full.href = "https://www.youtube.com/playlist?list=" + c.playlist;

    yt.src =
        "https://www.youtube.com/embed/" +
        c.videos[v] +
        "?rel=0&origin=" +
        encodeURIComponent(location.origin);

    es.innerHTML = "";

    c.videos.forEach((id, n) => {
        const b = document.createElement("button");

        b.className = "ep" + (n === v ? " active" : "");
        b.textContent = "第" + (n + 1) + "講";
        b.onclick = () => load(i, n);

        es.appendChild(b);
    });
}

data.forEach((c, i) => {
    const b = document.createElement("button");

    b.className = "course";
    b.textContent = c.title;
    b.onclick = () => load(i);

    cs.appendChild(b);
});
